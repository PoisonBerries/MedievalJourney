<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Medieval Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css?v=6" />
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas" width="960" height="600"></canvas>
    <div id="hud">
      <div id="hud-life"><span class="hud-label">Life</span><div class="bar life-bar"><div class="bar-fill" id="life-fill"></div></div><span id="life-num"></span></div>
      <div id="hud-q"><span class="hud-label">Quickels</span><span id="q-num">0</span></div>
      <div id="area-name" class="hud-area"></div>
      <button id="inv-btn" title="Inventory (I)">Inventory [I]</button>
    </div>
    <div id="ui-root"></div>
    <div id="title-screen">
      <h1>MEDIEVAL JOURNEY</h1>
      <p class="subtitle">a hand-drawn board game, digitized</p>
      <button id="new-game-btn" class="title-btn">New Game</button>
      <button id="continue-btn" class="title-btn">Continue</button>
      <div class="controls-help">
        WASD / Arrows: move &nbsp;•&nbsp; E / Space / Click: interact &nbsp;•&nbsp; I: inventory
      </div>
    </div>
    <div id="death-screen" class="hidden">
      <h1>YOU HAVE FALLEN</h1>
      <p>Your journey ends here... for now.</p>
      <button id="restart-btn" class="title-btn">Start Over</button>
    </div>
  </div>

  <script src="js/pixelart.js?v=6"></script>
  <script src="js/sprites.js?v=6"></script>
  <script src="js/state.js?v=6"></script>
  <script src="js/engine.js?v=6"></script>
  <script src="js/ui.js?v=6"></script>
  <script src="js/combat.js?v=6"></script>
  <script src="js/data/mapgen.js?v=6"></script>
  <script src="js/data/items.js?v=6"></script>
  <script src="js/data/enemies.js?v=6"></script>

  <script>const Areas = {};</script>

  <script src="js/data/happytown.js?v=6"></script>
  <script src="js/data/farmlands.js?v=6"></script>
  <script src="js/data/richvillage.js?v=6"></script>
  <script src="js/data/randomtavern.js?v=6"></script>
  <script src="js/data/hermit_riverbank.js?v=6"></script>
  <script src="js/data/woods.js?v=6"></script>
  <script src="js/data/monsterhills.js?v=6"></script>
  <script src="js/data/thegate.js?v=6"></script>
  <script src="js/data/castle.js?v=6"></script>
  <script src="js/data/merlin.js?v=6"></script>
  <script src="js/data/overworld_south.js?v=6"></script>
  <script src="js/data/overworld_north.js?v=6"></script>

  <script src="js/main.js?v=6"></script>
</body>
</html>
